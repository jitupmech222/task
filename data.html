<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Data Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="container" style="max-width: 1100px;">
      <header class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>NSE Data (<span id="record-count">0</span>)</h1>
        <button onclick="window.location.href='index.html'" class="nav-btn">← Dashboard</button>
      </header>

      <div class="card">
        <!-- મુખ્ય બટનો -->
        <div class="sub-btn-group" style="flex-wrap: wrap; justify-content: space-between; align-items: center;">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" id="btn-full-data" class="action-btn">Full Data</button>
            <button type="button" id="btn-custom-data" class="action-btn" style="background-color: #7c3aed;">Custom Data</button>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" id="btn-download-excel" class="action-btn" style="background-color: #0284c7;">📥 Download View Excel</button>
            <button type="button" id="btn-clear-all-filters" class="action-btn" style="background-color: #64748b;">🔄 Clear Filters</button>
          </div>
        </div>

        <h3 id="view-title" style="margin-top: 12px;">Full Data View</h3>

        <!-- ડેટા ટેબલ -->
        <div class="table-wrapper">
          <table id="data-table">
            <thead id="data-thead"></thead>
            <tbody id="data-tbody">
              <tr><td>ડેટા લોડ થઈ રહ્યો છે...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- EXCEL STYLE COLUMN FILTER POPUP -->
    <div id="filter-dropdown-overlay" class="modal-overlay" style="display: none;">
      <div class="excel-filter-box">
        <input type="text" id="filter-search-input" class="filter-search-box" placeholder="Search..." />

        <label class="filter-item-row select-all-row">
          <input type="checkbox" id="filter-select-all" checked />
          <strong>(Select All)</strong>
        </label>

        <div id="filter-options-list" class="filter-options-scroll">
          <!-- અહીં ચેકબોક્સ લિસ્ટ બનશે -->
        </div>

        <div class="filter-footer-btns">
          <button type="button" id="filter-ok-btn" class="filter-btn-ok">OK</button>
          <button type="button" id="filter-clear-btn" class="filter-btn-clear">Clear</button>
        </div>
      </div>
    </div>

    <!-- EDIT & DELETE MODAL -->
    <div id="edit-modal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
          <h3 id="modal-title" style="margin: 0;">Edit Row</h3>
          <button type="button" id="close-modal-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;">✖</button>
        </div>

        <div id="edit-fields-container" style="max-height: 60vh; overflow-y: auto; padding-right: 5px; margin-top: 10px;"></div>

        <div style="display: flex; gap: 10px; margin-top: 18px; border-top: 1px solid #e2e8f0; padding-top: 12px;">
          <button type="button" id="save-edit-btn" class="submit-btn" style="margin-top: 0; flex: 2;">Save to Database</button>
          <button type="button" id="delete-row-btn" class="submit-btn" style="margin-top: 0; flex: 1; background-color: #dc2626;">Delete Row</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data.js"></script>
  </body>
</html>
