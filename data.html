<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Data Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      .table-tabs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .tab-btn {
        padding: 10px 18px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #1e293b;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
      }
      .tab-btn.active {
        background: #2563eb;
        color: #ffffff;
        border-color: #2563eb;
      }
      .filter-dropdown {
        position: fixed;
        background: #ffffff;
        border: 1px solid #94a3b8;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        padding: 12px;
        z-index: 9999;
        width: 240px;
        max-height: 320px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .filter-values-list {
        max-height: 170px;
        overflow-y: auto;
        border: 1px solid #e2e8f0;
        padding: 6px;
        border-radius: 4px;
        font-size: 13px;
      }
      .filter-values-list label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        margin: 0;
        font-weight: normal;
        cursor: pointer;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.55);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        padding: 15px;
        box-sizing: border-box;
      }
      .modal-box {
        background: #ffffff;
        border-radius: 10px;
        padding: 20px;
        width: 100%;
        max-width: 520px;
        max-height: 88vh;
        overflow-y: auto;
      }
      .th-filter-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 12px;
        margin-left: 4px;
        color: #475569;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .th-filter-btn.filtered {
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container" style="max-width: 1100px;">
      <header class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Database Data</h1>
        <button onclick="window.location.href='index.html'" class="nav-btn">← Dashboard</button>
      </header>

      <div class="card">
        <!-- 3 ટેબલ પસંદ કરવાના બટન -->
        <div class="table-tabs">
          <button type="button" class="tab-btn active" data-table="task_nse">1) task_nse</button>
          <button type="button" class="tab-btn" data-table="nse_task">2) nse_task</button>
          <button type="button" class="tab-btn" data-table="nse_task_trades">3) nse_task_trades</button>
        </div>

        <!-- ટૂલબાર: Refresh, Clear Filter, Download Excel -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;">
          <div>
            <strong id="active-table-title" style="font-size: 17px; color: #1e293b;">Table: task_nse</strong>
            <span id="row-count-badge" style="margin-left: 8px; font-size: 13px; color: #64748b;">(0 rows)</span>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" id="btn-refresh-data" class="mini-btn">🔄 Refresh</button>
            <button type="button" id="btn-clear-filters" class="mini-btn" style="background-color: #64748b;">✖ Clear Filters</button>
            <button type="button" id="btn-download-excel" class="mini-btn" style="background-color: #0284c7;">📥 Download Excel</button>
          </div>
        </div>

        <!-- ડેટા ટેબલ -->
        <div class="table-wrapper">
          <table id="report-table">
            <thead id="data-thead"></thead>
            <tbody id="data-tbody">
              <tr><td>ડેટા લોડ થઈ રહ્યો છે...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Excel-style Column Filter Popup -->
    <div id="column-filter-popup" class="filter-dropdown">
      <strong id="filter-col-title" style="font-size: 13px; color: #1e293b;">Filter</strong>
      <input type="text" id="filter-search-input" placeholder="Search..." style="padding: 6px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px;" />
      <div style="display: flex; gap: 6px; font-size: 12px;">
        <button type="button" id="btn-select-all-filter" class="mini-btn" style="padding: 4px 8px; font-size: 11px;">Select All</button>
        <button type="button" id="btn-deselect-all-filter" class="mini-btn" style="padding: 4px 8px; font-size: 11px; background:#94a3b8;">Clear</button>
      </div>
      <div id="filter-values-container" class="filter-values-list"></div>
      <div style="display: flex; justify-content: flex-end; gap: 6px;">
        <button type="button" id="btn-cancel-filter" class="mini-btn" style="background: #64748b; padding: 5px 10px;">Cancel</button>
        <button type="button" id="btn-apply-filter" class="mini-btn" style="padding: 5px 10px;">Apply</button>
      </div>
    </div>

    <!-- Edit Row Modal -->
    <div id="edit-modal" class="modal-overlay">
      <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 id="edit-modal-title" style="margin: 0; color: #1d4ed8;">Edit Record</h3>
          <button type="button" id="btn-close-modal" style="background: none; border: none; font-size: 20px; cursor: pointer;">✖</button>
        </div>
        <div id="edit-fields-container"></div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px;">
          <button type="button" id="btn-cancel-edit" class="mini-btn" style="background: #64748b;">Cancel</button>
          <button type="button" id="btn-save-edit" class="mini-btn" style="background: #16a34a;">Save Changes</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data.js"></script>
  </body>
</html>
