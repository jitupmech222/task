<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Treading</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>NSE Treading</h1>
        <button onclick="window.location.href='index.html'" class="nav-btn">← Dashboard</button>
      </header>

      <div class="card">
        <h2>Select Option</h2>
        <div class="sub-btn-group">
          <button type="button" id="btn-new" class="action-btn">1) New (Buy / Sell)</button>
          <button type="button" id="btn-in-progress" class="action-btn" style="background-color: #d97706;">2) In Progress</button>
        </div>

        <!-- 1) NEW TRADE FORM (BUY OR SELL FIRST + AUTO CHARGES) -->
        <div id="new-trade-form" class="form-box" style="display: none;">
          <h3>1) New Trade Entry</h3>

          <label>Segment (ચાર્જ ગણતરી માટે):</label>
          <select id="trade_segment" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #0284c7; border-radius: 6px; font-size: 15px; font-weight: bold; background-color: #f0f9ff;">
            <option value="INTRADAY">Intraday Equity (NSE)</option>
            <option value="OPTIONS">Equity Options (NSE)</option>
            <option value="MCX_OPTIONS">Commodity Options (MCX)</option>
          </select>

          <label>Trade Type (પહેલા શું કરવું છે?):</label>
          <select id="trade_side" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #2563eb; border-radius: 6px; font-size: 15px; font-weight: bold; background-color: #eff6ff;">
            <option value="BUY">BUY (પહેલા ખરીદી કરો)</option>
            <option value="SELL">SELL (પહેલા વેચાણ / Short કરો)</option>
          </select>

          <label>Date:</label>
          <input type="date" id="first_date" required />

          <label>Stock Name:</label>
          <input type="text" id="stock_name" placeholder="દા.ત. RELIANCE, NIFTY, CRUDEOIL" required />

          <label id="lbl_first_price">Buy Price:</label>
          <input type="number" step="0.01" id="first_price" placeholder="0.00" required />

          <label id="lbl_first_qty">Buy Qty:</label>
          <input type="number" step="1" id="first_qty" placeholder="0" required />

          <label id="lbl_first_charges">Buy Charges (Auto Calculated):</label>
          <input type="number" step="0.01" id="first_charges" placeholder="0.00" required />

          <button type="button" id="save-new-btn" class="submit-btn">Save First Entry</button>
        </div>

        <!-- 2) IN PROGRESS SECTION -->
        <div id="in-progress-section" class="form-box" style="display: none;">
          <h3>2) In Progress Trades</h3>
          <div id="pending-list">ડેટા લોડ થઈ રહ્યો છે...</div>

          <div id="complete-trade-form" style="display: none; margin-top: 20px; border-top: 1px solid #cbd5e1; padding-top: 15px;">
            <h4 id="selected-stock-title" style="color: #1d4ed8;">Complete Entry</h4>
            <input type="hidden" id="selected_sr_no" />
            <input type="hidden" id="missing_side" />
            <input type="hidden" id="hidden_existing_amount" />
            <input type="hidden" id="hidden_existing_charges" />

            <label>Segment (ચાર્જ ગણતરી માટે):</label>
            <select id="complete_segment" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #0284c7; border-radius: 6px; font-size: 15px; font-weight: bold; background-color: #f0f9ff;">
              <option value="INTRADAY">Intraday Equity (NSE)</option>
              <option value="OPTIONS">Equity Options (NSE)</option>
              <option value="MCX_OPTIONS">Commodity Options (MCX)</option>
            </select>

            <label id="lbl_second_price">Price:</label>
            <input type="number" step="0.01" id="second_price" placeholder="0.00" required />

            <label id="lbl_second_qty">Qty:</label>
            <input type="number" step="1" id="second_qty" placeholder="0" required />

            <label id="lbl_second_charges">Charges (Auto Calculated):</label>
            <input type="number" step="0.01" id="second_charges" placeholder="0.00" required />

            <button type="button" id="update-complete-btn" class="submit-btn">Update & Complete Trade</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="treading.js"></script>
  </body>
</html>
