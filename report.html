<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Trading Report</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" style="max-width: 900px;">
      <header class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Trading Report</h1>
        <button onclick="window.location.href='index.html'" class="nav-btn">← Dashboard</button>
      </header>

      <div class="card">
        <!-- રિપોર્ટ ફિલ્ટર બટનો અને ગણતરી (Count) -->
        <div class="sub-btn-group" style="flex-wrap: wrap;">
          <button type="button" id="btn-all" class="action-btn">All Task (<span id="count-all">0</span>)</button>
          <button type="button" id="btn-completed" class="action-btn" style="background-color: #16a34a;">Completed Task (<span id="count-completed">0</span>)</button>
          <button type="button" id="btn-active" class="action-btn" style="background-color: #d97706;">Active Task (<span id="count-active">0</span>)</button>
        </div>

        <h3 id="report-title" style="margin-top: 20px;">All Tasks</h3>

        <!-- ડેટા બતાવવા માટે સ્ક્રોલ કરી શકાય તેવું ટેબલ -->
        <div class="table-wrapper">
          <table id="report-table">
            <thead id="table-head"></thead>
            <tbody id="table-body">
              <tr><td>ડેટા લોડ થઈ રહ્યો છે...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="report.js"></script>
  </body>
</html>
