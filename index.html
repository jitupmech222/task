<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>Dashboard</h1>
      </header>

      <div class="button-grid">
        <button class="nav-btn active">Treading</button>
        <button class="nav-btn">Generate task</button>
        <button class="nav-btn">Sattelment</button>
        <button class="nav-btn">Report</button>
        <button class="nav-btn">Data</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <h2 style="margin: 0;">Overview (Active Tasks)</h2>
          <button type="button" onclick="loadDashboardOverview()" class="mini-btn">🔄 Refresh</button>
        </div>

        <!-- કુલ Active Tasks અને કુલ રકમનો સારાંશ -->
        <div style="display: flex; gap: 12px; margin-bottom: 16px;">
          <div style="flex: 1; background: #eff6ff; padding: 12px; border-radius: 8px; border: 1px solid #bfdbfe;">
            <div style="font-size: 12px; color: #1e40af;">Total Active Tasks</div>
            <div id="total-active-qty" style="font-size: 20px; font-weight: bold; color: #1d4ed8; margin-top: 4px;">0</div>
          </div>
          <div style="flex: 1; background: #f0fdf4; padding: 12px; border-radius: 8px; border: 1px solid #bbf7d0;">
            <div style="font-size: 12px; color: #166534;">Total Active Amount</div>
            <div id="total-active-amt" style="font-size: 20px; font-weight: bold; color: #15803d; margin-top: 4px;">₹0.00</div>
          </div>
        </div>

        <!-- Level-wise Active Task ટેબલ -->
        <div class="table-wrapper">
          <table id="report-table">
            <thead>
              <tr>
                <th>Task Level</th>
                <th>Base Amount</th>
                <th>Active Task Qty</th>
                <th>Total Amount</th>
              </tr>
            </thead>
            <tbody id="overview-level-tbody">
              <tr><td colspan="4">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=2"></script>
  </body>
</html>
