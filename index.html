<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSE Trading Task</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <!-- મુખ્ય Trading બટન -->
    <button id="tradingBtn" class="main-btn">Trading</button>

    <!-- વિકલ્પ પસંદ કરવા માટે (1. New / 2. In Progress) -->
    <div id="optionSection" style="display: none; margin-top: 20px;">
      <h3>Select Option:</h3>
      <button id="newBtn" class="sub-btn">1) New</button>
      <button id="inProgressBtn" class="sub-btn">2) In Progress</button>
    </div>

    <!-- 1) NEW TRADE FORM -->
    <div id="newFormSection" class="card" style="display: none;">
      <h3>New Trade Entry</h3>
      <label>Date:</label>
      <input type="date" id="buyDate" required>

      <label>Stock Name:</label>
      <input type="text" id="stockName" placeholder="દા.ત. RELIANCE, TCS" required>

      <label>Buy Price:</label>
      <input type="number" step="0.01" id="buyPrice" placeholder="0.00" required>

      <label>Buy Qty:</label>
      <input type="number" step="1" id="buyQty" placeholder="0" required>

      <label>Buy Charges:</label>
      <input type="number" step="0.01" id="buyCharges" placeholder="0.00" required>

      <button id="saveNewBtn" class="save-btn">Save New Trade</button>
    </div>

    <!-- 2) IN PROGRESS SECTION -->
    <div id="inProgressSection" class="card" style="display: none;">
      <h3>In Progress Trades (Pending Sell)</h3>
      <div id="pendingList">લોડ થઈ રહ્યું છે...</div>

      <!-- પસંદ કરેલા સ્ટોકની Sell વિગતો ભરવા માટેનું ફોર્મ -->
      <div id="sellFormSection" style="display: none; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
        <h4 id="selectedStockTitle">Selected Stock</h4>
        <input type="hidden" id="selectedSrNo">
        <input type="hidden" id="hiddenBuyAmount">
        <input type="hidden" id="hiddenBuyCharges">

        <label>Sell Price:</label>
        <input type="number" step="0.01" id="sellPrice" placeholder="0.00" required>

        <label>Sell Qty:</label>
        <input type="number" step="1" id="sellQty" placeholder="0" required>

        <label>Sell Charges:</label>
        <input type="number" step="0.01" id="sellCharges" placeholder="0.00" required>

        <button id="updateSellBtn" class="save-btn">Update & Complete Trade</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
